[project]
name = "retfound"
version = "0.1.0"
description = "Fork of RETfound repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub~=0.23.4",
    "matplotlib",
    "numpy",
    "opencv-python~=4.9.0.80",
    "pillow",
    "pycm~=4.0",
    "scikit-learn",
    "scikit-multilearn",
    "tensorboard",
    "timm~=0.9.2",
]

[uv.tool]
package = true
python-preference = "managed"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["RETFound",  "util"]

# List every top-level .py you want installed (without .py extension)
py-modules = [
    "models_vit",
    "engine_finetune",
    "main_finetune"
]
